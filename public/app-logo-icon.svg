<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="cyanGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neonGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbit Ring -->
  <path d="M 50 8 C 80 8, 92 28, 92 50 C 92 72, 80 92, 50 92 C 20 92, 8 72, 8 50 C 8 28, 20 8, 50 8 Z" 
        stroke="url(#cyanGradIcon)" stroke-width="4.5" fill="none" filter="url(#neonGlowIcon)" opacity="0.9" />
  
  <!-- Intertwined Orbit Ring -->
  <path d="M 25 18 C 65 3, 85 43, 75 73 C 65 93, 25 78, 15 53 C 5 33, 10 23, 25 18 Z" 
        stroke="#00f2fe" stroke-width="3" stroke-dasharray="6 3" fill="none" opacity="0.65" />

  <!-- Center Vault Shield Body -->
  <path d="M 50 22 L 74 34 V 54 C 74 70 50 82 50 82 C 50 82 26 70 26 54 V 34 L 50 22 Z" 
        fill="#0f2238" stroke="url(#cyanGradIcon)" stroke-width="3.5" filter="url(#neonGlowIcon)" />
  
  <!-- Inner Keyhole Symbol -->
  <circle cx="50" cy="44" r="6" fill="#22d3ee" />
  <polygon points="47,46 53,46 55,60 45,60" fill="#22d3ee" />
</svg>
