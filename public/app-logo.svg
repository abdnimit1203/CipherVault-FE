<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <defs>
    <!-- Cyan to Sky Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Group: Intertwined Encrypted Vault Shield & Keyhole -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Orbit Ring 1 -->
    <path d="M 50 10 C 80 10, 95 30, 95 50 C 95 70, 80 90, 50 90 C 20 90, 5 70, 5 50 C 5 30, 20 10, 50 10 Z" 
          stroke="url(#cyanGrad)" stroke-width="4" fill="none" filter="url(#neonGlow)" opacity="0.85" />
    
    <!-- Intertwined Orbit Ring 2 -->
    <path d="M 25 20 C 65 5, 85 45, 75 75 C 65 95, 25 80, 15 55 C 5 35, 10 25, 25 20 Z" 
          stroke="#00f2fe" stroke-width="3" stroke-dasharray="6 3" fill="none" opacity="0.6" />

    <!-- Center Vault Shield Body -->
    <path d="M 50 24 L 74 36 V 56 C 74 72 50 84 50 84 C 50 84 26 72 26 56 V 36 L 50 24 Z" 
          fill="#0f2238" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#neonGlow)" />
    
    <!-- Inner Keyhole Symbol -->
    <circle cx="50" cy="46" r="6" fill="#22d3ee" />
    <polygon points="47,48 53,48 55,62 45,62" fill="#22d3ee" />
  </g>

  <!-- Right Brand Typography -->
  <g transform="translate(120, 42)">
    <!-- ABD-CipherVault Title -->
    <text x="0" y="28" font-family="'Orbitron', 'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="34" fill="url(#cyanGrad)" letter-spacing="1.5" filter="url(#neonGlow)">
      ABD-CipherVault
    </text>
  </g>
</svg>
